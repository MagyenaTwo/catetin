<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f6f8; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Register</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form action="/register" method="POST">
            <label>Username</label>
            <input type="text" name="username" required>
            <label>No. WhatsApp (contoh: 628123456789)</label>
            <input type="text" name="phone_number" required>
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit">Daftar</button>
        </form>
        <p style="font-size: 0.85em;">Sudah punya akun? <a href="/login">Login di sini</a></p>
    </div>
</body>
</html>
